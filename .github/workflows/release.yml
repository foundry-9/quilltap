name: Release

on:
  push:
    tags:
      # Matches:
      # - 3.2.1
      # - 3.2.0-dev.21
      # - 3.2.0-beta.1
      - '[0-9]*.[0-9]*.[0-9]*'

# Read-only by default. create-release escalates for itself; note that it also
# authenticates with GH_RELEASE_TOKEN, so the grant is belt-and-braces.
permissions:
  contents: read

# Two tags pushed close together must not race for the same Docker manifest or
# GitHub release. Never cancel a release mid-flight — a half-pushed multi-arch
# manifest is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: foundry9/quilltap

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Shared JS build — runs once, produces platform-agnostic artifacts that
  # every downstream job reuses. Tag validation lives here rather than in a job
  # of its own: it was a whole runner spin-up for one regex, and it has to
  # happen before anything else builds either way.
  # ────────────────────────────────────────────────────────────────────────────
  build-app:
    name: Build application (shared JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Two checks, not one. The format check is obvious. The version check is
      # not, and it guards a failure that surfaces only after release:
      # build-standalone names the tarball from package.json's version
      # (`quilltap-standalone-<version>.tar.gz`), while the published CLI builds
      # its download URL from the git TAG — publish-npm force-writes the tag
      # into the package. Let those diverge and the release still goes green
      # (the asset upload uses a glob), but every `npx quilltap` first run 404s.
      - name: Validate tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver-ish (expected 1.2.3 or 1.2.3-dev.21)"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG_VERSION'."
            echo "::error::The standalone tarball is named from package.json but the CLI"
            echo "::error::downloads it by tag, so this would publish a CLI that 404s."
            echo "::error::Run scripts/update_version.sh and re-tag."
            exit 1
          fi
          echo "✅ Tag $TAG matches package.json"

      - name: Build plugins
        run: npm run build:plugins

      # Turbopack, NOT --webpack. 7cba1eb4 moved the standalone build off
      # webpack because its NFT tracer misses next/dist/compiled/webpack-lib,
      # which broke the Electron shell's embedded server (CHANGELOG_V4.md).
      # That fix lived only in scripts/build-standalone-tarball.mjs, which CI
      # invokes with --skip-build — so until now every release still shipped a
      # webpack-traced tree. Keep this in step with ci.yml :: build.
      - name: Build Next.js standalone
        run: SKIP_ENV_VALIDATION=true npx next build

      # Compile our custom server.ts and out-of-band entry points into the
      # standalone tree, then drop the bootstrap shim over Next's auto-generated
      # server.js. Without this, published Docker images run Next's default
      # standalone server (no WebSocket upgrade handler → no terminal in Docker)
      # and the forked background-job child loads raw .ts and crashes on @/.
      # Single source of truth for esbuild flags + child externals lives in
      # scripts/build-standalone-overlay.mjs (also invoked by the local
      # Dockerfile and scripts/build-standalone-tarball.mjs).
      - name: Compile custom server, terminal handler, and child entry
        run: node scripts/build-standalone-overlay.mjs .next/standalone

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          include-hidden-files: true
          path: |
            .next/standalone/
            .next/static/
            plugins/dist/
          retention-days: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Standalone tarball — downloads pre-built JS, strips native modules,
  # creates the tarball that the quilltap npm package downloads on first run.
  # Also used by the external Electron shell for bootstrapping.
  # ────────────────────────────────────────────────────────────────────────────
  build-standalone:
    name: Build standalone tarball
    needs: build-app
    runs-on: ubuntu-latest

    steps:
      # install: false — this job never resolves project dependencies. The build
      # scripts are plain .mjs precisely so that stays true (they used to be .ts
      # and needed an unpinned `npx --yes tsx` fetched mid-release).
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download pre-built app
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: .

      - name: Build standalone tarball (skip next build)
        run: node scripts/build-standalone-tarball.mjs --skip-build

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: quilltap-standalone-*.tar.gz
          retention-days: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Docker + rootfs — builds Docker image from pre-built JS via Dockerfile.ci,
  # pushes to Docker Hub, then exports the filesystem as a rootfs tarball.
  # Combining Docker and rootfs in one job avoids a redundant image build.
  #
  # Native modules (better-sqlite3, sharp, node-pty) are compiled inside
  # Dockerfile.ci for Debian/glibc — on a NATIVE runner per arch, never QEMU.
  # ────────────────────────────────────────────────────────────────────────────
  build-docker-and-rootfs:
    name: Docker + rootfs (${{ matrix.arch }})
    needs: build-app
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download pre-built app
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: prebuild

      # The platform → Dockerfile-target mapping lives in build-rootfs.mjs and
      # is read back out here, rather than being restated in the matrix. It was
      # in both places and nothing kept them honest.
      - name: Resolve rootfs target
        id: rootfs
        run: |
          set -euo pipefail
          TARGET=$(node scripts/build-rootfs.mjs --print-target --platform '${{ matrix.platform }}')
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Rootfs target for ${{ matrix.platform }}: $TARGET"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub Actions layer cache, scoped per arch so the two legs never
      # clobber each other. What it buys is the expensive layer: Dockerfile.ci's
      # `npm ci --omit=dev && npm rebuild`, which compiles every native module
      # from source. NOTE: the GHA cache is ~10 GB repo-wide and evicts LRU, so
      # if these images ever crowd out other caches, drop cache-to here first.
      - name: Build and push to primary registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          target: production
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Build the rootfs target locally — shares the buildx layer cache with the
      # push above, so this is nearly instant (production layers cached; on
      # amd64 the wsl2 target adds only a few lightweight layers, and on arm64
      # the target IS production, so it is a pure cache hit plus a daemon load).
      - name: Build rootfs image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          target: ${{ steps.rootfs.outputs.target }}
          load: true
          tags: quilltap-rootfs:local
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export rootfs tarball
        run: node scripts/build-rootfs.mjs --image quilltap-rootfs:local --platform '${{ matrix.platform }}'

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ matrix.arch }}
          path: quilltap-linux-${{ matrix.arch }}.tar.gz
          retention-days: 5

  push-docker-manifest:
    name: Push Docker multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-docker-and-rootfs

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          TAGS="${DOCKER_IMAGE}:${TAG}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS} ${DOCKER_IMAGE}:latest"
          else
            TAGS="${TAGS} ${DOCKER_IMAGE}:dev"
          fi

          for MANIFEST_TAG in $TAGS; do
            docker buildx imagetools create -t "$MANIFEST_TAG" \
              "${DOCKER_IMAGE}:${TAG}-amd64" \
              "${DOCKER_IMAGE}:${TAG}-arm64"
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-standalone, push-docker-manifest]
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.release-type.outputs.prerelease }}

    steps:
      # fetch-depth 0 — the release-type check reads git history.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      # Only the release assets. A bare download-artifact with no filter drags
      # in app-build too — the whole traced standalone tree, hundreds of MB —
      # to use four files. Two explicit steps rather than one brace pattern:
      # brace expansion is not guaranteed by the action's matcher, and a
      # pattern that silently matches nothing would fail the release at the
      # very last step.
      - name: Download rootfs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rootfs-*
          path: artifacts

      - name: Download standalone artifact
        uses: actions/download-artifact@v8
        with:
          name: standalone
          path: artifacts/standalone

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine release type
        id: release-type
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Check if this is a clean x.y.z tag (no prerelease suffix)
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_TAG=true
          else
            CLEAN_TAG=false
          fi

          # Check if the tagged commit is on the release branch
          ON_RELEASE=$(git branch -r --contains HEAD | grep -q 'origin/release' && echo true || echo false)

          # Production release requires clean tag AND release branch
          if [[ "$CLEAN_TAG" == "true" && "$ON_RELEASE" == "true" ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release type: production"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release type: prerelease (clean_tag=$CLEAN_TAG, on_release=$ON_RELEASE)"
          fi

      - name: Resolve latest quilltap-shell release
        id: shell-release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          SHELL_TAG=$(gh release view --repo foundry-9/quilltap-shell --json tagName -q .tagName 2>/dev/null || echo "")
          if [[ -z "$SHELL_TAG" ]]; then
            echo "shell_url=https://github.com/foundry-9/quilltap-shell/releases" >> "$GITHUB_OUTPUT"
            echo "shell_label=quilltap-shell releases" >> "$GITHUB_OUTPUT"
          else
            echo "shell_url=https://github.com/foundry-9/quilltap-shell/releases/tag/${SHELL_TAG}" >> "$GITHUB_OUTPUT"
            echo "shell_label=quilltap-shell ${SHELL_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: release-notes
        env:
          IS_PRERELEASE: ${{ steps.release-type.outputs.prerelease }}
          SHELL_URL: ${{ steps.shell-release.outputs.shell_url }}
          SHELL_LABEL: ${{ steps.shell-release.outputs.shell_label }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${TAG}.md"

          # Build the installation section
          cat > /tmp/install-body.md <<INSTALL
          ## Installation

          ### Desktop App (recommended)

          The Quilltap desktop app (Electron) is available from
          [${SHELL_LABEL}](${SHELL_URL}).
          Download the release for your platform (macOS, Windows, or Linux).

          The \`quilltap-linux-arm64.tar.gz\` and \`quilltap-linux-amd64.tar.gz\` rootfs
          tarballs attached to this release are used by the shell's Lima (macOS) and WSL2 (Windows) VM modes.

          ### Node.js (any platform)

          \`\`\`bash
          npm install -g quilltap
          quilltap
          \`\`\`

          On first run, the CLI downloads the application files (~150-250 MB)
          and caches them locally. Subsequent launches start instantly.

          ### Docker

          \`\`\`bash
          docker pull foundry9/quilltap:${TAG}
          \`\`\`

          See the [README](https://github.com/foundry-9/quilltap-server#readme) for setup instructions.
          INSTALL
          sed -i 's/^          //' /tmp/install-body.md

          if [[ -f "$NOTES_FILE" ]]; then
            # Strip YAML frontmatter (everything between the first two --- lines)
            sed '1{/^---$/!q}; 1,/^---$/d' "$NOTES_FILE" > /tmp/release-body.md
            echo "" >> /tmp/release-body.md
            cat /tmp/install-body.md >> /tmp/release-body.md
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_PRERELEASE" == "false" ]]; then
            echo "::error::Production release requires release notes at ${NOTES_FILE}"
            exit 1
          else
            cp /tmp/install-body.md /tmp/release-body.md
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PRERELEASE: ${{ steps.release-type.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          PRERELEASE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=(
            artifacts/rootfs-amd64/quilltap-linux-amd64.tar.gz
            artifacts/rootfs-arm64/quilltap-linux-arm64.tar.gz
            artifacts/standalone/quilltap-standalone-*.tar.gz
          )

          gh release create "$TAG" \
            --title "Quilltap $TAG" \
            --notes-file /tmp/release-body.md \
            $PRERELEASE_FLAG \
            "${ASSETS[@]}"

  publish-npm:
    name: Publish quilltap to npm
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          install: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine dist-tag
        id: dist-tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      # build-app has already proved the tag matches package.json, so this is a
      # no-op in the normal case; it stays because the CLI's download URL is
      # built from whatever version ends up here.
      - name: Set package version to match release tag
        working-directory: packages/quilltap
        run: npm version "${GITHUB_REF_NAME}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/quilltap
        run: npm publish --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-website:
    name: Notify website of release
    runs-on: ubuntu-latest
    needs: [create-release, publish-npm]
    # The website should learn about the release even if the npm publish failed
    # — but not if the run was cancelled.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}

    steps:
      - name: Trigger website rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: foundry-9/quilltap-website
          event-type: app-release
          client-payload: >-
            {
              "version": "${{ github.ref_name }}",
              "prerelease": "${{ needs.create-release.outputs.prerelease }}",
              "docker_image": "foundry9/quilltap:${{ github.ref_name }}"
            }

  github-releases-to-discord:
    name: Announce release on Discord
    runs-on: ubuntu-latest
    needs: create-release
    # A failed announcement must never fail a release.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build the release embed
        id: embed
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg version "$VERSION" \
            --arg release_url "$RELEASE_URL" \
            '{
              embeds: [{
                title: ("Quilltap " + $version + " Released"),
                url: $release_url,
                description: "A new version of Quilltap has been published. See the release notes for details.",
                color: 5814783
              }]
            }')
          {
            echo "payload<<__PAYLOAD_EOF__"
            printf '%s\n' "$payload"
            echo "__PAYLOAD_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord of release
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_RELEASE_URL }}
          payload: ${{ steps.embed.outputs.payload }}
          description: release notification
