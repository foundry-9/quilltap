name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          # Skip env validation during build since runtime vars aren't needed
          SKIP_ENV_VALIDATION: 'true'
          ENCRYPTION_MASTER_PEPPER: 'test-pepper-for-ci-environment-32chars!'
          BASE_URL: 'http://localhost:3000'

      # Nothing downstream consumes the build — this job exists to prove the
      # application still compiles, so the output is checked and discarded.
      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build reported success but .next was never created"
            exit 1
          fi
          echo "✅ Build directory created ($(du -sh .next/ | cut -f1))"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -d "__tests__" ] && [ "$(find __tests__ -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.test.jsx' | wc -l)" -gt 0 ]; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Tests found"
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️  No tests found in __tests__ directory"
          fi

      - name: Run tests with coverage
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: npm run test:coverage
        env:
          ENCRYPTION_MASTER_PEPPER: 'test-pepper-for-ci-environment-32chars!'

      - name: Report test status
        if: steps.check-tests.outputs.tests_exist == 'false'
        run: |
          echo "::warning::No tests found to run. Consider adding tests to improve code quality."
          echo "📝 To add tests, create test files in the __tests__ directory"

      - name: Verify coverage output
        id: verify-coverage
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: |
          if [ -d "coverage" ]; then
            echo "✅ Coverage directory created"
            echo "coverage_exists=true" >> $GITHUB_OUTPUT
            ls -la coverage/
            if [ -f "coverage/coverage-summary.json" ]; then
              echo "✅ Coverage summary file exists"
              echo "coverage_summary_exists=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Coverage summary file not found"
              echo "coverage_summary_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Coverage directory not found"
            echo "coverage_exists=false" >> $GITHUB_OUTPUT
            echo "coverage_summary_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage report
        if: steps.check-tests.outputs.tests_exist == 'true' && steps.verify-coverage.outputs.coverage_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 30

      - name: Coverage Summary
        if: steps.check-tests.outputs.tests_exist == 'true' && steps.verify-coverage.outputs.coverage_summary_exists == 'true'
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            console.log('| Metric | Coverage |');
            console.log('|--------|----------|');
            console.log(\`| Lines | \${total.lines.pct}% (\${total.lines.covered}/\${total.lines.total}) |\`);
            console.log(\`| Statements | \${total.statements.pct}% (\${total.statements.covered}/\${total.statements.total}) |\`);
            console.log(\`| Functions | \${total.functions.pct}% (\${total.functions.covered}/\${total.functions.total}) |\`);
            console.log(\`| Branches | \${total.branches.pct}% (\${total.branches.covered}/\${total.branches.total}) |\`);
          " >> $GITHUB_STEP_SUMMARY

      - name: No coverage generated warning
        if: steps.check-tests.outputs.tests_exist == 'true' && steps.verify-coverage.outputs.coverage_exists == 'false'
        run: |
          echo "::warning::Tests ran but no coverage was generated. Check jest configuration."
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ No coverage data was generated." >> $GITHUB_STEP_SUMMARY

  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    # This used to run tristanbudd/discord-commit-github-action, a JavaScript
    # action pinned to the node20 runtime. 1.0.1 is its latest release and it
    # still declares `using: node20`, so there was no version to bump to — the
    # runner's deprecation warning had no fix short of dropping the action. The
    # embed it posted is a single webhook call, reproduced below with curl, so
    # the step now has no runtime to go stale. Nothing to check out either: the
    # push event payload carries everything the notification needs.
    steps:
      - name: Post the commit to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Untrusted commit data goes through the environment, never through
          # ${{ }} interpolation into the shell — a commit message is attacker-
          # controlled text and would otherwise be a script-injection vector.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_LOGIN: ${{ github.event.head_commit.author.username || github.event.sender.login }}
          BRANCH: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set — skipping the Discord notification."
            exit 0
          fi

          # Branch deletions and some tag pushes arrive with no head_commit.
          if [ -z "$COMMIT_URL" ]; then
            echo "::notice::Push carried no head commit — nothing to announce."
            exit 0
          fi

          if [ -n "$AUTHOR_LOGIN" ]; then
            author="$AUTHOR_NAME ([$AUTHOR_LOGIN]($SERVER_URL/$AUTHOR_LOGIN))"
          else
            author="$AUTHOR_NAME"
          fi

          # jq builds the JSON so every value is escaped properly. Discord caps
          # a field value at 1024 characters; the fence and ellipsis fit inside
          # the headroom left by truncating the message at 900.
          payload=$(jq -n \
            --arg message "$COMMIT_MESSAGE" \
            --arg branch "$BRANCH" \
            --arg author "$author" \
            --arg commit_url "$COMMIT_URL" \
            --arg repo_url "$REPO_URL" \
            --arg timestamp "$COMMIT_TIMESTAMP" \
            '{
              embeds: [{
                title: "GitHub Commit Notification",
                color: 16777215,
                timestamp: $timestamp,
                fields: [
                  {
                    name: "Commit Message",
                    value: ("```\n" + (if ($message | length) > 900
                                       then ($message[0:900] + "\n…(truncated)")
                                       else $message end) + "\n```"),
                    inline: false
                  },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Author", value: $author, inline: false },
                  {
                    name: "Commit Link",
                    value: ("[View Commit](" + $commit_url + ") | [View Repository](" + $repo_url + ")"),
                    inline: false
                  }
                ]
              }]
            }')

          status=$(printf '%s' "$payload" | curl -sS -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            -o /tmp/discord-response.txt \
            -w '%{http_code}' \
            "$WEBHOOK_URL")

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✅ Discord notification sent (HTTP $status)"
          else
            echo "❌ Discord rejected the notification (HTTP $status)"
            cat /tmp/discord-response.txt
            exit 1
          fi

  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'skipped' && '⚠️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⚠️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **CI Pipeline Failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All CI checks passed!**" >> $GITHUB_STEP_SUMMARY
          fi
